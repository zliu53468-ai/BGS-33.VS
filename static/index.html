<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>富百家 AI Pro</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --yellow:#ffd000; --black:#111; --gray:#f4f4f4; --red:#e60012; --blue:#0033cc; --green:#00a000; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif; background:#f1f1f1; color:#111; }
    .wrap { max-width:480px; margin:0 auto; min-height:100vh; background:#fff; padding:14px; }
    .top { background:linear-gradient(135deg,#111,#2d2d2d); border-radius:18px; padding:16px; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.18); }
    .brand { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand h1 { font-size:21px; margin:0; color:var(--yellow); letter-spacing:.5px; }
    .pill { background:rgba(255,208,0,.16); color:var(--yellow); border:1px solid rgba(255,208,0,.5); border-radius:999px; padding:5px 10px; font-size:12px; }
    .card { background:#fff; border:1px solid #e7e7e7; border-radius:16px; padding:14px; margin-top:12px; box-shadow:0 3px 12px rgba(0,0,0,.06); }
    .title { font-weight:800; font-size:16px; border-bottom:2px solid var(--yellow); padding-bottom:8px; margin-bottom:10px; }
    .muted { color:#777; font-size:12px; line-height:1.5; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn { border:0; border-radius:12px; min-height:44px; padding:11px 12px; font-size:15px; font-weight:800; cursor:pointer; width:100%; }
    .btn-yellow { background:var(--yellow); color:#111; }
    .btn-dark { background:#242424; color:#fff; }
    .btn-red { background:#ffe8e8; color:var(--red); border:1px solid #ffb6b6; }
    .btn-blue { background:#e8edff; color:var(--blue); border:1px solid #bdc9ff; }
    .btn-green { background:#e9ffe9; color:var(--green); border:1px solid #b9efb9; }
    .btn:active { transform:scale(.98); }
    .hidden { display:none; }
    .loading { opacity:.55; pointer-events:none; }
    .platform, .table-card { border:1px solid #eee; background:#fafafa; border-radius:14px; padding:12px; }
    .platform b, .table-card b { display:block; text-align:center; color:#d9a300; margin-bottom:8px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:14px; border-bottom:1px dashed #eee; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
    .stat { background:#fafafa; border:1px solid #eee; border-radius:12px; padding:10px; text-align:center; }
    .stat small { display:block; color:#666; font-size:12px; }
    .stat b { font-size:19px; }
    .recommend { display:flex; justify-content:space-between; align-items:center; background:var(--yellow); border-radius:12px; padding:12px; font-size:18px; font-weight:900; margin-top:12px; }
    .road { display:flex; flex-wrap:wrap; gap:6px; min-height:38px; padding:10px; background:#fafafa; border-radius:12px; border:1px solid #eee; }
    .chip { width:28px; height:28px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; }
    .B { color:var(--red); background:#fff0f0; border:1px solid #ffb7b7; }
    .P { color:var(--blue); background:#eef2ff; border:1px solid #bac6ff; }
    .T { color:var(--green); background:#efffee; border:1px solid #b8ebb6; }
    .warn { background:#fff8df; border:1px solid #ffe28a; border-radius:12px; padding:10px; color:#6a4a00; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand">
      <h1>富百家 AI Pro</h1>
      <span class="pill" id="statusPill">初始化</span>
    </div>
    <p class="muted" style="color:#ddd;margin:10px 0 0;">平台 → 遊戲廳 → 桌號 → 自動讀取牌路 → 本地模型 + DeepSeek 校準。</p>
  </div>

  <div class="card" id="guideCard">
    <div class="title">1. 開始預測</div>
    <div class="warn">新版已移除手動輸入 B/P/T，系統會嘗試讀取平台真實桌號與牌路；若抓不到桌號，不會再顯示假 RB01。</div>
    <button class="btn btn-yellow" style="margin-top:12px;" onclick="startFlow()">開始預測</button>
  </div>

  <div class="card hidden" id="platformCard">
    <div class="title">2. 選擇平台</div>
    <div class="grid" id="platformList"></div>
  </div>

  <div class="card hidden" id="hallCard">
    <div class="title">3. 選擇遊戲廳</div>
    <div class="grid" id="hallList"></div>
  </div>

  <div class="card hidden" id="tableCard">
    <div class="title">4. 選擇桌號</div>
    <div class="muted">如果這裡沒有桌號，代表目前尚未抓到平台真實資料，請檢查 token 或 debug API。</div>
    <div id="tableList" style="display:grid;gap:10px;margin-top:10px;"></div>
  </div>

  <div class="card hidden" id="analysisCard">
    <div class="title">5. 分析數據</div>
    <div class="row"><span>桌號</span><b id="tableId">--</b></div>
    <div class="row"><span>遊戲編號</span><b id="gameNo">--</b></div>
    <div class="row"><span>荷官姓名</span><b id="dealer">--</b></div>
    <div class="row"><span>倒數 / 狀態</span><b id="statusLine">--</b></div>
    <div class="road" id="road"><span class="muted">尚未讀取牌路</span></div>
    <div class="stats">
      <div class="stat"><small>莊</small><b style="color:var(--red);" id="bRate">--</b></div>
      <div class="stat"><small>閒</small><b style="color:var(--blue);" id="pRate">--</b></div>
      <div class="stat"><small>和</small><b style="color:var(--green);" id="tRate">--</b></div>
    </div>
    <div class="recommend"><span>推薦</span><span id="rec">--</span></div>
    <p class="muted" id="pattern">牌路型態：--</p>
    <p class="muted" id="reason">原因：--</p>
    <p class="muted" id="aiInfo">DeepSeek：--</p>
    <div class="grid" style="margin-top:10px;">
      <button class="btn btn-yellow" onclick="continueAnalyze()">繼續分析</button>
      <button class="btn btn-dark" onclick="stopAnalyze()">結束分析</button>
    </div>
  </div>
</div>

<script>
let CONFIG = null;
let USER_ID = localStorage.getItem('baccarat_user_id') || '';
let SESSION = null;
let TABLES = [];
let POLL_TIMER = null;

function api(path, options={}) {
  return fetch(path, {headers:{'Content-Type':'application/json'}, ...options}).then(async r => {
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.detail || data.error || 'API error');
    return data;
  });
}
function setLoading(on){ document.getElementById('app').classList.toggle('loading', !!on); }
function show(id, on){ document.getElementById(id).classList.toggle('hidden', !on); }
function setStatus(text){ document.getElementById('statusPill').textContent = text; }

async function init(){
  CONFIG = await api('/api/config');
  await initLiff();
  buildPlatforms();
  buildHalls();
  await loadCurrent();
}
async function initLiff(){
  try {
    if (CONFIG.liffId && window.liff) {
      await liff.init({liffId: CONFIG.liffId});
      if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return; }
      const profile = await liff.getProfile();
      USER_ID = profile.userId;
    }
  } catch(e) { console.warn('LIFF init failed', e); }
  if (!USER_ID) USER_ID = 'local_' + Math.random().toString(36).slice(2);
  localStorage.setItem('baccarat_user_id', USER_ID);
}
async function loadCurrent(){
  const data = await api('/api/session/current?user_id=' + encodeURIComponent(USER_ID));
  SESSION = data.session;
  renderSession();
}
function buildPlatforms(){
  const box = document.getElementById('platformList'); box.innerHTML = '';
  (CONFIG.platforms || []).forEach(p => {
    const div = document.createElement('div'); div.className = 'platform';
    div.innerHTML = `<b>${p.name}</b><button class="btn btn-yellow">選擇</button>`;
    div.querySelector('button').onclick = () => selectPlatform(p.key);
    box.appendChild(div);
  });
  if (!(CONFIG.platforms || []).length) box.innerHTML = '<div class="warn">尚未設定任何平台網址，請到 Render 加 BACCARAT_URL_GSA / DG / REBIRTH。</div>';
}
function buildHalls(){
  const box = document.getElementById('hallList'); box.innerHTML = '';
  (CONFIG.halls || []).forEach(h => {
    const div = document.createElement('div'); div.className = 'platform';
    div.innerHTML = `<b>${h.name}</b><button class="btn btn-yellow">選擇</button>`;
    div.querySelector('button').onclick = () => selectHall(h.key);
    box.appendChild(div);
  });
}
async function startFlow(){
  setLoading(true);
  try {
    const data = await api('/api/flow/start', {method:'POST', body:JSON.stringify({user_id:USER_ID})});
    SESSION = data.session;
    show('platformCard', true); show('hallCard', false); show('tableCard', false); show('analysisCard', false);
    setStatus('選平台');
  } finally { setLoading(false); }
}
async function selectPlatform(platform){
  setLoading(true);
  try {
    const data = await api('/api/flow/platform', {method:'POST', body:JSON.stringify({user_id:USER_ID, platform})});
    SESSION = data.session;
    show('hallCard', true); show('tableCard', false); show('analysisCard', false);
    setStatus('選遊戲廳');
  } catch(e){ alert(e.message); } finally { setLoading(false); }
}
async function selectHall(hall){
  setLoading(true);
  try {
    const data = await api('/api/flow/hall', {method:'POST', body:JSON.stringify({user_id:USER_ID, hall})});
    SESSION = data.session; TABLES = data.tables || [];
    buildTables(TABLES);
    show('tableCard', true); show('analysisCard', false);
    setStatus(TABLES.length ? '選桌號' : '未抓到桌號');
  } catch(e){ alert('讀取桌號失敗：' + e.message); } finally { setLoading(false); }
}
function buildTables(tables){
  const box = document.getElementById('tableList'); box.innerHTML = '';
  if (!tables.length) { box.innerHTML = '<div class="warn">目前沒有讀到真實桌號。請先開 /api/debug/baccarat 檢查頁面文字、network_tables 是否有資料。</div>'; return; }
  tables.forEach(t => {
    const div = document.createElement('div'); div.className = 'table-card';
    div.innerHTML = `<b>${t.table_id || '--'}</b>
      <div class="row"><span>遊戲編號</span><span>${t.game_no || '讀取中'}</span></div>
      <div class="row"><span>荷官姓名</span><span>${t.dealer || '讀取中'}</span></div>
      <div class="row"><span>在線人數</span><span>${t.online_count || 0}</span></div>
      <p class="muted">來源：${t.source || 'unknown'}</p>
      <button class="btn btn-yellow">選擇</button>`;
    div.querySelector('button').onclick = () => selectTable(t.table_id);
    box.appendChild(div);
  });
}
async function selectTable(table_id){
  setLoading(true);
  try {
    const data = await api('/api/flow/table', {method:'POST', body:JSON.stringify({user_id:USER_ID, table_id})});
    SESSION = data.session;
    renderAnalysis(data.data, data.prediction);
    show('analysisCard', true);
    setStatus('分析中');
    startAutoPoll();
  } catch(e){ alert('讀取桌台失敗：' + e.message); } finally { setLoading(false); }
}
async function continueAnalyze(){
  setLoading(true);
  try {
    const data = await api('/api/analyze/continue', {method:'POST', body:JSON.stringify({user_id:USER_ID})});
    SESSION = data.session;
    renderAnalysis(data.data, data.prediction);
    setStatus('已更新');
  } catch(e){ console.warn(e); setStatus('讀取失敗'); } finally { setLoading(false); }
}
async function stopAnalyze(){
  setLoading(true);
  try {
    const data = await api('/api/analyze/stop', {method:'POST', body:JSON.stringify({user_id:USER_ID})});
    SESSION = data.session;
    stopAutoPoll(); setStatus('已停止'); alert('已結束分析');
  } finally { setLoading(false); }
}
function startAutoPoll(){
  stopAutoPoll();
  const ms = CONFIG.frontendAutoPollMs || 6000;
  POLL_TIMER = setInterval(() => continueAnalyze(), ms);
}
function stopAutoPoll(){ if (POLL_TIMER) clearInterval(POLL_TIMER); POLL_TIMER = null; }
function renderSession(){
  if (!SESSION) return;
  setStatus(SESSION.status || SESSION.step || '待命');
  if (SESSION.step === 'PLATFORM_SELECT') show('platformCard', true);
  if (SESSION.platform) show('hallCard', true);
  if (SESSION.hall) show('tableCard', true);
  if (SESSION.last_prediction) { show('analysisCard', true); renderAnalysis({
    table_id:SESSION.table_id, game_no:SESSION.game_no, dealer:SESSION.dealer, countdown:SESSION.countdown, status:SESSION.status, road:SESSION.road
  }, SESSION.last_prediction); if (SESSION.running) startAutoPoll(); }
}
function renderAnalysis(data, pred){
  data = data || {}; pred = pred || {};
  document.getElementById('tableId').textContent = data.table_id || '--';
  document.getElementById('gameNo').textContent = data.game_no || '讀取中';
  document.getElementById('dealer').textContent = data.dealer || '讀取中';
  document.getElementById('statusLine').textContent = `${data.countdown || 0} 秒 / ${data.status || '讀取中'}`;
  document.getElementById('bRate').textContent = (pred.banker_percent ?? pred.banker_rate ?? '--') + '%';
  document.getElementById('pRate').textContent = (pred.player_percent ?? pred.player_rate ?? '--') + '%';
  document.getElementById('tRate').textContent = (pred.tie_percent ?? pred.tie_rate ?? '--') + '%';
  document.getElementById('rec').textContent = pred.recommend || pred.recommend_text || '--';
  document.getElementById('pattern').textContent = '牌路型態：' + (pred.pattern_detail || pred.pattern_type || '--');
  document.getElementById('reason').textContent = '原因：' + (pred.reason || '--');
  document.getElementById('aiInfo').textContent = 'DeepSeek：' + (pred.ai_used ? '已啟用｜' : '未啟用/未成功｜') + (pred.ai_reason || '');
  const roadBox = document.getElementById('road'); roadBox.innerHTML = '';
  const road = data.road || [];
  if (!road.length) roadBox.innerHTML = '<span class="muted">尚未讀取牌路</span>';
  road.slice(-60).forEach(x => { const s = document.createElement('span'); s.className = 'chip ' + x; s.textContent = x; roadBox.appendChild(s); });
}
init().catch(e => { console.error(e); alert('初始化失敗：' + e.message); });
</script>
</body>
</html>

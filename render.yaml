services:
  - type: web
    name: baccarat-ai-line-bot
    env: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/.playwright"
      - key: HEADLESS
        value: "true"
      - key: POLL_INTERVAL_SECONDS
        value: "5"
      - key: FRONTEND_AUTO_POLL_MS
        value: "6000"
      - key: AUTO_PUSH_NEW_ROUND
        value: "true"
      - key: USE_DOM_READER
        value: "true"
      - key: USE_NETWORK_READER
        value: "true"
      - key: USE_COLOR_READER
        value: "true"
      - key: ALLOW_DEFAULT_TABLE_IDS
        value: "false"
      - key: READER_WAIT_MS
        value: "3500"
      - key: LINE_LOADING_ENABLED
        value: "true"
      - key: LINE_LOADING_SECONDS
        value: "20"
      - key: STRICT_TABLE_METADATA
        value: "false"
      - key: MANUAL_FIRST_TABLE_MODE
        value: "false"
      - key: AUTO_SCAN_TABLES_ON_HALL
        value: "true"
      - key: TABLE_CLICK_TIMEOUT_MS
        value: "2500"
      - key: TARGET_TABLE_ONLY
        value: "true"
      - key: ROAD_AUTO_DETECT
        value: "true"
      - key: AUTO_COLOR_FULL_SCAN
        value: "true"
      - key: ROAD_ROI_X
        value: "0"
      - key: ROAD_ROI_Y
        value: "0"
      - key: ROAD_ROI_W
        value: "0"
      - key: ROAD_ROI_H
        value: "0"
      - key: COLOR_MIN_AREA
        value: "30"
      - key: COLOR_MAX_AREA
        value: "2500"
      - key: TARGET_ROAD_ROI_X
        value: "0"
      - key: TARGET_ROAD_ROI_Y
        value: "0"
      - key: TARGET_ROAD_ROI_W
        value: "0"
      - key: TARGET_ROAD_ROI_H
        value: "0"
      - key: ROAD_X
        value: "0"
      - key: ROAD_Y
        value: "0"
      - key: CELL_W
        value: "28"
      - key: CELL_H
        value: "28"
      - key: ROAD_COLS
        value: "30"
      - key: ROAD_ROWS
        value: "6"
      - key: LOGIN_CHECK_ENABLED
        value: "true"
      - key: LOGIN_MIN_TEXT_LENGTH
        value: "80"
